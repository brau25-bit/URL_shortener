services:

  redis:
    image: redis
    ports:
      - "6379:6379"

  pg:
    image: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg-volume:/var/lib/postgresql


  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  pg-volume:
    name: pg-volume